name: regenerate healing map

on:
  push:
    branches:
      - healing-locations-and-party-rules
    paths:
      - "scripts/healing_locations.py"
      - "scripts/build_location_encounters.py"
      - ".github/workflows/regenerate-healing-map.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: healing-locations-and-party-rules
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: regenerate map and browser tool
        run: python scripts/build_location_encounters.py
      - name: validate healing allocation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path("scripts").resolve()))
          import gameplay_rules as game

          data = json.loads(Path("location_map.json").read_text(encoding="utf-8"))
          healing = [location for location in data["locations"] if location.get("healing_location")]
          assert len(healing) == game.HEALING_LOCATION_COUNT, len(healing)
          forbidden = {f"loc_{index:03d}" for index in range(1, 7)} | {"loc_100"}
          assert not ({location["id"] for location in healing} & forbidden)
          html = Path("index.html").read_text(encoding="utf-8")
          assert 'id="healing_note"' in html
          assert game.HEALING_NOTE in html
          assert "encounterDifficultyLabel(encounter.difficulty)" not in html
          print("validated_healing_locations=25")
          PY
      - name: commit generated map files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add location_map.json index.html monster_encounters.json
          if git diff --cached --quiet; then
            echo "generated files already current"
          else
            git commit -m "Regenerate map with healing locations"
            git push origin HEAD:healing-locations-and-party-rules
          fi
