name: regenerate encounter data

on:
  push:
    branches:
      - encounter-blending

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: regenerate encounters
        run: python scripts/build_location_encounters.py
      - name: commit generated encounter data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html location_map.json monster_encounters.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Regenerate blended encounter data"
          git push
