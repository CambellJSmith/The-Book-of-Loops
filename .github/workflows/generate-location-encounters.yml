name: generate location encounters

on:
  push:
    branches:
      - feature/location-monster-encounters
    paths:
      - scripts/build_location_encounters.py

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/location-monster-encounters
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: generate encounter distribution
        run: python scripts/build_location_encounters.py
      - name: commit generated map data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html location_map.json monster_encounters.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Generate location monster encounters [skip ci]"
          git push origin HEAD:feature/location-monster-encounters
