name: bootstrap digital player

on:
  push:
    branches:
      - feature/digital-player

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/digital-player
      - name: write digital player files
        shell: bash
        run: |
          echo '[... truncated for readability ...]' | base64 -d > /tmp/digital-player.tar.gz
          tar -xzf /tmp/digital-player.tar.gz -C .
      - name: commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digital_game scripts/healing_locations.py .github/workflows/digital-game.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "add digital player"
          git push origin HEAD:feature/digital-player
