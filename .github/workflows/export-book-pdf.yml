name: export book pdf

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/export_book_pdf.py"
      - "scripts/export_book_pdf_dense.py"
      - "scripts/export_book_pdf_with_lore.py"
      - "scripts/export_book_pdf_with_rules.py"
      - "scripts/gameplay_rules.py"
      - ".github/workflows/export-book-pdf.yml"
      - "location_map.json"
      - "monster_encounters.json"
      - "card_foundry/data/card_objects.json"
      - "card_foundry/data/standalone_400.json"
      - "card_foundry/lib/card_model.ts"
      - "card_foundry/lib/card_balance.ts"
      - "card_foundry/scripts/build_card_set.py"
      - "*.png"
  push:
    branches:
      - main
    paths:
      - "scripts/export_book_pdf.py"
      - "scripts/export_book_pdf_dense.py"
      - "scripts/export_book_pdf_with_lore.py"
      - "scripts/export_book_pdf_with_rules.py"
      - "scripts/gameplay_rules.py"
      - ".github/workflows/export-book-pdf.yml"
      - "location_map.json"
      - "monster_encounters.json"
      - "card_foundry/data/card_objects.json"
      - "card_foundry/data/standalone_400.json"
      - "card_foundry/lib/card_model.ts"
      - "card_foundry/lib/card_balance.ts"
      - "card_foundry/scripts/build_card_set.py"
      - "*.png"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install pdf dependencies
        run: python -m pip install --disable-pip-version-check reportlab pillow pypdf
      - name: validate canonical combat data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import sys

          sys.path.insert(0, str(Path("scripts").resolve()))
          import gameplay_rules as rules

          portable = json.loads(Path("card_foundry/data/card_objects.json").read_text(encoding="utf-8"))["cards"]
          generated = json.loads(Path("card_foundry/data/standalone_400.json").read_text(encoding="utf-8"))
          assert len(portable) == 400, len(portable)
          assert len(generated) == 400, len(generated)
          for collection in (portable, generated):
              invalid = [card.get("species_id") for card in collection if not rules.move_two_is_stronger(card)]
              assert not invalid, invalid[:10]
          assert rules.STARTING_MANA == 0
          assert rules.MANA_PER_TURN == 1
          assert rules.gain_turn_mana(0) == 1
          assert rules.gain_turn_mana(4) == 5
          assert rules.enemy_move_index(4, 1, [{"mana_cost": 1}, {"mana_cost": 3}]) == 0
          assert rules.enemy_move_index(4, 0, [{"mana_cost": 1}, {"mana_cost": 3}]) is None
          print("validated_combat_rules=400+400")
          PY
      - name: export book
        run: python scripts/export_book_pdf_with_rules.py --output book_of_loops.pdf
      - name: validate pdf
        run: |
          python - <<'PY'
          from pypdf import PdfReader

          reader = PdfReader("book_of_loops.pdf")
          assert len(reader.pages) == 122, len(reader.pages)
          lore = reader.pages[0].extract_text() or ""
          rules = reader.pages[1].extract_text() or ""
          first_location = reader.pages[2].extract_text() or ""
          monsters = reader.pages[102].extract_text() or ""
          final = reader.pages[121].extract_text() or ""
          visible_text = "\n".join((page.extract_text() or "") for page in reader.pages).upper()
          assert "The First Loop" in lore
          assert "And this time, you remember." in lore
          assert "Gameplay Rules" in rules
          assert "Confluence village" in rules and "p. 3" in rules
          assert "Shower hill village" in rules and "p. 8" in rules
          assert "0 Mana" in rules
          assert "gains 1 Mana" in rules
          assert "Move 2 always costs more Mana" in rules
          assert "1-3" in rules and "Move 1" in rules
          assert "4-6" in rules and "Move 2" in rules
          assert "5-6" in rules and "full Health" in rules
          assert "monster_encounters" in first_location
          assert "To go to Saffron prairie, go to page 16." in first_location
          assert "monster_reference" in monsters
          assert "#0001" in monsters
          assert "#0400" in final
          assert "FINAL BOSS" in final
          assert "DIFFICULTY" not in visible_text
          assert "EXTRA HARD" not in visible_text
          assert "ULTRA" not in visible_text
          print(f"validated_pages={len(reader.pages)}")
          PY
      - name: upload pdf
        uses: actions/upload-artifact@v4
        with:
          name: book-of-loops-pdf
          path: book_of_loops.pdf
          if-no-files-found: error
          retention-days: 14