name: export book pdf

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/export_book_pdf.py"
      - "scripts/export_book_pdf_dense.py"
      - "scripts/export_book_pdf_with_lore.py"
      - "scripts/export_book_pdf_with_rules.py"
      - "scripts/export_book_pdf_complete.py"
      - "scripts/gameplay_rules.py"
      - ".github/workflows/export-book-pdf.yml"
      - "location_map.json"
      - "monster_encounters.json"
      - "card_foundry/data/card_objects.json"
      - "card_foundry/data/standalone_400.json"
      - "card_foundry/lib/card_model.ts"
      - "card_foundry/lib/card_balance.ts"
      - "card_foundry/scripts/build_card_set.py"
      - "*.png"
  push:
    branches:
      - main
    paths:
      - "scripts/export_book_pdf.py"
      - "scripts/export_book_pdf_dense.py"
      - "scripts/export_book_pdf_with_lore.py"
      - "scripts/export_book_pdf_with_rules.py"
      - "scripts/export_book_pdf_complete.py"
      - "scripts/gameplay_rules.py"
      - ".github/workflows/export-book-pdf.yml"
      - "location_map.json"
      - "monster_encounters.json"
      - "card_foundry/data/card_objects.json"
      - "card_foundry/data/standalone_400.json"
      - "card_foundry/lib/card_model.ts"
      - "card_foundry/lib/card_balance.ts"
      - "card_foundry/scripts/build_card_set.py"
      - "*.png"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install pdf dependencies
        run: python -m pip install --disable-pip-version-check reportlab pillow pypdf
      - name: validate canonical combat data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import sys

          sys.path.insert(0, str(Path("scripts").resolve()))
          import gameplay_rules as rules

          portable = json.loads(Path("card_foundry/data/card_objects.json").read_text(encoding="utf-8"))["cards"]
          generated = json.loads(Path("card_foundry/data/standalone_400.json").read_text(encoding="utf-8"))
          assert len(portable) == 400, len(portable)
          assert len(generated) == 400, len(generated)
          for collection in (portable, generated):
              invalid = [card.get("species_id") for card in collection if not rules.move_two_is_stronger(card)]
              assert not invalid, invalid[:10]
          assert rules.STARTING_MANA == 0
          assert rules.MANA_PER_TURN == 1
          assert rules.gain_turn_mana(0) == 1
          assert rules.gain_turn_mana(4) == 5
          assert rules.enemy_move_index(4, 1, [{"mana_cost": 1}, {"mana_cost": 3}]) == 0
          assert rules.enemy_move_index(4, 0, [{"mana_cost": 1}, {"mana_cost": 3}]) is None
          print("validated_combat_rules=400+400")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
      - name: enable pnpm
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - name: install card foundry dependencies
        working-directory: card_foundry
        run: pnpm install --frozen-lockfile
      - name: build card foundry
        working-directory: card_foundry
        run: pnpm build
      - name: export book
        run: python scripts/export_book_pdf_complete.py --output book_of_loops.pdf
      - name: validate pdf
        run: |
          python - <<'PY'
          from pypdf import PdfReader

          reader = PdfReader("book_of_loops.pdf")
          assert len(reader.pages) == 124, len(reader.pages)
          cover = reader.pages[0].extract_text() or ""
          contents = reader.pages[1].extract_text() or ""
          lore = reader.pages[2].extract_text() or ""
          rules = reader.pages[3].extract_text() or ""
          rules_flat = " ".join(rules.split())
          first_location = reader.pages[4].extract_text() or ""
          monsters = reader.pages[104].extract_text() or ""
          final = reader.pages[123].extract_text() or ""
          visible_text = "\n".join((page.extract_text() or "") for page in reader.pages).upper()
          assert "THE BOOK" in cover and "OF LOOPS" in cover
          assert "A DICE-DRIVEN MONSTER ADVENTURE" in cover
          assert "Contents" in contents
          assert "The First Loop" in contents and "3" in contents
          assert "Gameplay Rules" in contents and "4" in contents
          assert "Locations 001-100" in contents and "5-104" in contents
          assert "Species #0001-#0400" in contents and "105-124" in contents
          assert "Confluence village" in contents and "5" in contents
          assert "Shower hill village" in contents and "10" in contents
          assert "The First Loop" in lore
          assert "And this time, you remember." in lore
          assert "Gameplay Rules" in rules
          assert "Confluence village" in rules and "p. 5" in rules
          assert "Shower hill village" in rules and "p. 10" in rules
          assert "0 Mana" in rules_flat
          assert "gains 1 Mana" in rules_flat
          assert "Move 2 always costs more Mana" in rules_flat
          assert "deals more damage than Move 1" in rules_flat
          assert "1-3" in rules_flat and "Move 1" in rules_flat
          assert "4-6" in rules_flat and "Move 2" in rules_flat
          assert "5-6" in rules_flat and "full Health" in rules_flat
          assert "monster_encounters" in first_location
          assert "To go to Saffron prairie, go to page 18." in first_location
          assert "monster_reference" in monsters
          assert "#0001" in monsters
          assert "#0400" in final
          assert "FINAL BOSS" in final
          assert "DIFFICULTY" not in visible_text
          assert "EXTRA HARD" not in visible_text
          assert "ULTRA" not in visible_text
          print(f"validated_pages={len(reader.pages)}")
          PY
      - name: upload pdf
        uses: actions/upload-artifact@v4
        with:
          name: book-of-loops-pdf
          path: book_of_loops.pdf
          if-no-files-found: error
          retention-days: 14
