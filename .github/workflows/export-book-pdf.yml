name: export book pdf

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/export_book_pdf.py"
      - "scripts/export_book_pdf_dense.py"
      - ".github/workflows/export-book-pdf.yml"
      - "location_map.json"
      - "monster_encounters.json"
      - "card_foundry/data/card_objects.json"
      - "*.png"
  push:
    branches:
      - main
    paths:
      - "scripts/export_book_pdf.py"
      - "scripts/export_book_pdf_dense.py"
      - ".github/workflows/export-book-pdf.yml"
      - "location_map.json"
      - "monster_encounters.json"
      - "card_foundry/data/card_objects.json"
      - "*.png"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install pdf dependencies
        run: python -m pip install --disable-pip-version-check reportlab pillow pypdf
      - name: export book
        run: python scripts/export_book_pdf_dense.py --output book_of_loops.pdf
      - name: validate pdf
        run: |
          python - <<'PY'
          from pypdf import PdfReader

          reader = PdfReader("book_of_loops.pdf")
          assert len(reader.pages) == 120, len(reader.pages)
          first = reader.pages[0].extract_text() or ""
          monsters = reader.pages[100].extract_text() or ""
          final = reader.pages[119].extract_text() or ""
          assert "monster_encounters" in first
          assert "monster_reference" in monsters
          assert "#0001" in monsters
          assert "#0400" in final
          print(f"validated_pages={len(reader.pages)}")
          PY
      - name: upload pdf
        uses: actions/upload-artifact@v4
        with:
          name: book-of-loops-pdf
          path: book_of_loops.pdf
          if-no-files-found: error
          retention-days: 14
