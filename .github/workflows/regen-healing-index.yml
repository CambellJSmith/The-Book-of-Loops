name: regenerate healing map ui

on:
  push:
    branches:
      - feature/healing-locations-and-team-cap

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/healing-locations-and-team-cap
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: patch browser map
        run: python scripts/healing_locations.py
      - name: commit generated map
        run: |
          if git diff --quiet -- index.html; then
            echo "index already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "render healing locations in map tool"
          git push origin HEAD:feature/healing-locations-and-team-cap
