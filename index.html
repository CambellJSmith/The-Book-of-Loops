<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Book of Loops Map Tool</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #11161c; }
    #mapTool { width: 100%; height: 100%; border: 0; display: block; }
  </style>
</head>
<body>
  <iframe id="mapTool" src="map_tool.html" title="The Book of Loops map tool"></iframe>
  <script>
    const frame = document.getElementById("mapTool");
    let healingNote = "You may choose one of your monsters and fully heal it.";
    let healingLocations = new Set();

    fetch("healing_locations.json", { cache: "no-store" })
      .then((response) => {
        if (!response.ok) throw new Error(`healing locations request failed: ${response.status}`);
        return response.json();
      })
      .then((data) => {
        healingNote = String(data.note || healingNote);
        healingLocations = new Set(Array.isArray(data.locations) ? data.locations.map(String) : []);
        syncHealingSection();
      })
      .catch((error) => console.error("Could not load healing locations", error));

    let healingSection = null;
    let selectedLocationId = () => null;

    function syncHealingSection() {
      if (!healingSection) return;
      const locationId = selectedLocationId();
      healingSection.hidden = !locationId || !healingLocations.has(locationId);
    }

    frame.addEventListener("load", () => {
      const doc = frame.contentDocument;
      const win = frame.contentWindow;
      if (!doc || !win) return;

      const helper = doc.createElement("script");
      helper.textContent = "window.__bookOfLoopsSelectedLocationId = () => (typeof selectedLocation !== 'undefined' && selectedLocation ? String(selectedLocation.id || '') : '');";
      doc.body.appendChild(helper);
      selectedLocationId = () => {
        try { return String(win.__bookOfLoopsSelectedLocationId?.() || ""); }
        catch { return ""; }
      };

      const editorGrid = doc.querySelector(".editor-grid");
      if (!editorGrid) return;

      healingSection = doc.createElement("div");
      healingSection.id = "locationHealing";
      healingSection.className = "editor-field";
      healingSection.hidden = true;
      healingSection.innerHTML = `<div style="font-weight:700;margin-bottom:6px">Healing</div><div style="padding:10px 12px;border:1px solid rgba(216,179,106,.45);border-radius:8px;background:rgba(216,179,106,.08);line-height:1.45">${healingNote}</div>`;

      const artwork = doc.getElementById("locationArtwork")?.closest(".editor-field");
      editorGrid.insertBefore(healingSection, artwork || null);

      const selectionLabel = doc.getElementById("selectionLabel");
      if (selectionLabel) new MutationObserver(syncHealingSection).observe(selectionLabel, { childList: true, characterData: true, subtree: true });
      const nameInput = doc.getElementById("nameInput");
      if (nameInput) nameInput.addEventListener("input", syncHealingSection);
      win.addEventListener("pointerup", syncHealingSection);
      win.addEventListener("keyup", syncHealingSection);
      setInterval(syncHealingSection, 500);
      syncHealingSection();
    });
  </script>
</body>
</html>
